allowBuilds:
  esbuild: true
  workerd: true

# Patched versions of transitive dependencies that astro 7.4.x still resolves to
# vulnerable releases. Remove an entry once `pnpm audit` is clean without it.
overrides:
  "undici@>=8.0.0 <8.12.2": ">=8.12.2"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
