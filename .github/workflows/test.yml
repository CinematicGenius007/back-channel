name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: code/go.mod
      - run: go test ./...
      - run: go test -race .
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/bch .
      - run: ./build.sh
